<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星空哲思动态页</title>
    <style>
      :root {
        --gold: #ffe9a8;
        --moon: #f3d48f;
        --blue: #9cc9ff;
        --lavender: #c8a8ff;
        --pink: #f5a6d7;
        --leaf-dark: rgba(4, 11, 25, 0.76);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(57, 74, 133, 0.28), transparent 42%),
          linear-gradient(180deg, #070b16 0%, #101936 100%);
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background: #0d1730;
        box-shadow: none;
      }

      .backdrop {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(4, 9, 20, 0.04), rgba(7, 10, 24, 0.1)),
          url("night-stars-background-clean.png") center / cover no-repeat;
        transform: none;
      }

      .aurora {
        position: absolute;
        inset: -10%;
        opacity: 0.32;
        background:
          radial-gradient(ellipse at 42% 42%, rgba(122, 150, 255, 0.2), transparent 36%),
          radial-gradient(ellipse at 58% 74%, rgba(183, 134, 255, 0.16), transparent 42%),
          radial-gradient(ellipse at 28% 68%, rgba(255, 211, 134, 0.1), transparent 32%);
        filter: blur(18px);
        animation: driftGlow 16s ease-in-out infinite alternate;
        mix-blend-mode: screen;
      }

      .branch-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .branch {
        transform-box: fill-box;
        transform-origin: var(--origin);
        animation: branchSway var(--time) ease-in-out infinite alternate;
      }

      .branch path {
        fill: none;
        stroke: var(--leaf-dark);
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sparkles {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .text-veil {
        position: absolute;
        left: 9%;
        right: 9%;
        top: 44%;
        z-index: 5;
        height: 13%;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at center, rgba(7, 17, 42, 0.9) 0%, rgba(7, 17, 42, 0.72) 48%, rgba(7, 17, 42, 0) 78%);
        filter: blur(6px);
        pointer-events: none;
      }

      .quote {
        position: absolute;
        left: 9%;
        right: 9%;
        top: 49.4%;
        z-index: 6;
        margin: 0;
        color: #ffe7a4;
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
        font-size: clamp(19px, 3.45vw, 31px);
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.22;
        text-align: center;
        transform: translateY(-50%);
        text-shadow:
          0 0 1px rgba(255, 248, 218, 0.96),
          0 0 12px rgba(255, 212, 119, 0.32),
          0 0 28px rgba(125, 169, 255, 0.18);
        pointer-events: none;
      }

      .quote .line {
        display: block;
      }

      .quote .line + .line {
        margin-top: 0.18em;
      }

      .quote .char {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.45em);
        background: linear-gradient(180deg, #fff9dc 0%, #f4d58d 48%, #d9efff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: writeIn 0.68s cubic-bezier(0.2, 0.72, 0.22, 1) forwards;
        animation-delay: calc(var(--i) * 0.075s + 0.35s);
      }

      .sparkle {
        position: absolute;
        left: var(--x);
        top: var(--y);
        color: var(--c);
        font-size: var(--s);
        line-height: 1;
        opacity: 0;
        filter: none;
        animation:
          twinkle var(--d) ease-in-out infinite,
          floatTiny calc(var(--d) * 1.4) ease-in-out infinite alternate;
        animation-delay: var(--delay);
      }

      .sparkle.moon {
        filter: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        z-index: 6;
        opacity: 0.14;
        pointer-events: none;
        background-image:
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 3px 3px, 4px 4px;
        mix-blend-mode: soft-light;
      }

      @keyframes driftGlow {
        from {
          transform: translate3d(-2%, -1%, 0) scale(1);
        }

        to {
          transform: translate3d(2%, 1.6%, 0) scale(1.04);
        }
      }

      @keyframes branchSway {
        from {
          transform: rotate(-1.2deg) translateX(-0.3%);
        }

        to {
          transform: rotate(1.4deg) translateX(0.4%);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: rotate(-4deg);
        }

        45% {
          opacity: 1;
          transform: rotate(4deg);
        }
      }

      @keyframes floatTiny {
        from {
          margin-top: -3px;
        }

        to {
          margin-top: 4px;
        }
      }

      @keyframes writeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

    </style>
  </head>
  <body>
    <main class="stage" aria-label="动态星空哲思界面">
      <div class="backdrop"></div>
      <div class="aurora"></div>

      <svg class="branch-layer" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true">
        <g class="branch" style="--origin: 0% 0%; --time: 7s">
          <path d="M -4 0 C 12 14, 21 28, 36 47" stroke-width="1.7" />
          <path d="M 12 14 C 20 12, 25 10, 34 6" stroke-width="0.65" />
          <path d="M 20 27 C 30 27, 37 31, 45 39" stroke-width="0.58" />
          <path d="M 27 37 C 31 45, 35 51, 41 58" stroke-width="0.5" />
        </g>
        <g class="branch" style="--origin: 100% 0%; --time: 8.5s">
          <path d="M 105 -2 C 89 12, 82 26, 70 45" stroke-width="2" />
          <path d="M 91 12 C 85 13, 76 14, 67 19" stroke-width="0.7" />
          <path d="M 82 25 C 76 32, 70 38, 62 43" stroke-width="0.58" />
          <path d="M 73 41 C 68 50, 64 59, 59 69" stroke-width="0.5" />
        </g>
        <g class="branch" style="--origin: 0% 100%; --time: 9s">
          <path d="M -2 152 C 12 129, 23 116, 38 102" stroke-width="1.8" />
          <path d="M 12 129 C 20 130, 27 129, 36 124" stroke-width="0.68" />
          <path d="M 21 118 C 25 111, 31 105, 39 96" stroke-width="0.52" />
        </g>
        <g class="branch" style="--origin: 100% 100%; --time: 7.6s">
          <path d="M 103 142 C 86 126, 78 116, 63 102" stroke-width="1.7" />
          <path d="M 88 127 C 80 126, 74 127, 68 131" stroke-width="0.58" />
          <path d="M 78 116 C 74 108, 69 101, 60 93" stroke-width="0.48" />
        </g>
      </svg>

      <div class="sparkles" aria-hidden="true"></div>
      <div class="text-veil" aria-hidden="true"></div>
      <p class="quote" aria-label="记录不是留住昨天，而是在回声里听见自己。"></p>
      <div class="grain"></div>
    </main>

    <script>
      const quoteLines = ["记录不是留住昨天，", "而是在回声里听见自己。"];
      const quoteEl = document.querySelector(".quote");
      let charIndex = 0;
      quoteEl.innerHTML = quoteLines
        .map((line) => {
          const chars = Array.from(line)
            .map((char) => `<span class="char" style="--i:${charIndex++}">${char}</span>`)
            .join("");
          return `<span class="line">${chars}</span>`;
        })
        .join("");

      const sparkleLayer = document.querySelector(".sparkles");
      const symbols = ["✦", "✧", "✶", "✷", "★", "•", "☾"];
      const colors = ["#ffe68f", "#fff6d8", "#9cc9ff", "#c8a8ff", "#f5a6d7", "#b6f3cf"];

      for (let index = 0; index < 86; index += 1) {
        const item = document.createElement("span");
        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
        const isMoon = symbol === "☾";
        let x = Math.random() * 96 + 2;
        let y = Math.random() * 92 + 2;
        const nearQuote = () => x > 7 && x < 93 && y > 39 && y < 61;
        while (nearQuote()) {
          x = Math.random() * 96 + 2;
          y = Math.random() * 92 + 2;
        }
        item.className = `sparkle${isMoon ? " moon" : ""}`;
        item.textContent = symbol;
        item.style.setProperty("--x", `${x}%`);
        item.style.setProperty("--y", `${y}%`);
        item.style.setProperty("--s", `${isMoon ? 14 + Math.random() * 10 : 7 + Math.random() * 12}px`);
        item.style.setProperty("--c", colors[Math.floor(Math.random() * colors.length)]);
        item.style.setProperty("--d", `${2.6 + Math.random() * 4.8}s`);
        item.style.setProperty("--delay", `${Math.random() * -6}s`);
        sparkleLayer.appendChild(item);
      }
    </script>
  </body>
</html>
